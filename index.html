<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAGUL KUMAR E | Digital Command Center</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        void: '#030305',
                        lightBg: '#E9ECEF', 
                        lightCard: 'rgba(255, 255, 255, 0.65)', 
                        darkCard: 'rgba(20, 11, 22, 0.6)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'spin-slow': 'spin 5s linear infinite',
                        'spin-fast': 'spin 1s linear infinite',
                        'shimmer': 'shimmer 3s linear infinite',
                        'blob': 'blob 7s infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'gemini-star': 'geminiStar 1.5s ease-in-out infinite alternate',
                        'fade-in': 'fadeIn 1.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', filter: 'blur(10px)' },
                            '100%': { opacity: '1', filter: 'blur(0px)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '200% center' },
                            '100%': { backgroundPosition: '-200% center' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        geminiStar: {
                            '0%': { transform: 'scale(0.8) rotate(0deg)' },
                            '100%': { transform: 'scale(1.2) rotate(90deg)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-padding-top: 100px; }
        
        /* Smooth Global Theme Transitions */
        body { transition: background-color 0.5s ease, color 0.5s ease; overflow-x: hidden; }

        /* Glass Base & Card Hover Animations */
        .glass-base {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* The Identity Card Animated Border Wrapper */
        .identity-wrapper {
            position: relative;
            padding: 3px;
            border-radius: 1.5rem;
            background: linear-gradient(90deg, #06b6d4, #d946ef, #f43f5e, #f59e0b, #10b981, #06b6d4);
            background-size: 300% 100%;
            animation: shimmer 4s linear infinite;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.3);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
        }
        .identity-wrapper:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(6, 182, 212, 0.5);
        }
        .identity-inner {
            background-color: theme('colors.lightBg');
            border-radius: calc(1.5rem - 3px);
            height: 100%;
        }
        .dark .identity-inner {
            background-color: theme('colors.void');
        }

        /* Text Gradients */
        .gemini-text {
            background: linear-gradient(90deg, #06b6d4, #d946ef, #f43f5e, #f59e0b, #06b6d4);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        .progress-bar-fill { transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d946ef; border-radius: 10px; }
    </style>
</head>
<body class="antialiased min-h-screen bg-lightBg dark:bg-void text-slate-800 dark:text-white selection:bg-fuchsia-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 100% React Safe Icon Wrapper ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const [svgContent, setSvgContent] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    setSvgContent(window.lucide.icons[name].toSvg({ class: className, width: size, height: size }));
                }
            }, [name, size, className]);
            return <span className="inline-flex items-center justify-center transition-all duration-300" dangerouslySetInnerHTML={{ __html: svgContent }} />;
        };

        // --- Cinematic Scroll Reveal ---
        const Reveal = ({ children, delay = 0, direction = "up", className = "" }) => {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                        observer.unobserve(entry.target);
                    }
                }, { threshold: 0.15, rootMargin: "0px 0px -50px 0px" });
                
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            const getTransform = () => {
                if (isVisible) return 'translate-y-0 translate-x-0 scale-100 opacity-100 blur-0';
                switch(direction) {
                    case 'up': return 'translate-y-16 scale-[0.95] opacity-0 blur-[8px]';
                    case 'left': return '-translate-x-16 scale-[0.95] opacity-0 blur-[8px]';
                    case 'right': return 'translate-x-16 scale-[0.95] opacity-0 blur-[8px]';
                    default: return 'translate-y-16 scale-[0.95] opacity-0 blur-[8px]';
                }
            };

            return (
                <div ref={ref} style={{ transitionDelay: `${delay}ms` }} className={`transition-all duration-[1000ms] cubic-bezier(0.2, 0.8, 0.2, 1) ${getTransform()} ${className}`}>
                    {children}
                </div>
            );
        };

        // --- Multi-color Dynamic Hover Array ---
        const glowStyles = [
            { border: 'border-cyan-500/40 hover:border-cyan-500', text: 'group-hover:text-cyan-500', bg: 'group-hover:bg-cyan-500/10', dot: 'bg-cyan-500/20 group-hover:bg-cyan-500', shadow: 'hover:shadow-[0_0_20px_rgba(6,182,212,0.4)]', textStatic: 'text-cyan-600 dark:text-cyan-400', hex: '#06b6d4' },
            { border: 'border-fuchsia-500/40 hover:border-fuchsia-500', text: 'group-hover:text-fuchsia-500', bg: 'group-hover:bg-fuchsia-500/10', dot: 'bg-fuchsia-500/20 group-hover:bg-fuchsia-500', shadow: 'hover:shadow-[0_0_20px_rgba(217,70,239,0.4)]', textStatic: 'text-fuchsia-600 dark:text-fuchsia-400', hex: '#d946ef' },
            { border: 'border-emerald-500/40 hover:border-emerald-500', text: 'group-hover:text-emerald-500', bg: 'group-hover:bg-emerald-500/10', dot: 'bg-emerald-500/20 group-hover:bg-emerald-500', shadow: 'hover:shadow-[0_0_20px_rgba(16,185,129,0.4)]', textStatic: 'text-emerald-600 dark:text-emerald-400', hex: '#10b981' },
            { border: 'border-amber-500/40 hover:border-amber-500', text: 'group-hover:text-amber-500', bg: 'group-hover:bg-amber-500/10', dot: 'bg-amber-500/20 group-hover:bg-amber-500', shadow: 'hover:shadow-[0_0_20px_rgba(245,158,11,0.4)]', textStatic: 'text-amber-600 dark:text-amber-400', hex: '#f59e0b' },
            { border: 'border-rose-500/40 hover:border-rose-500', text: 'group-hover:text-rose-500', bg: 'group-hover:bg-rose-500/10', dot: 'bg-rose-500/20 group-hover:bg-rose-500', shadow: 'hover:shadow-[0_0_20px_rgba(244,63,94,0.4)]', textStatic: 'text-rose-600 dark:text-rose-400', hex: '#f43f5e' },
            { border: 'border-indigo-500/40 hover:border-indigo-500', text: 'group-hover:text-indigo-500', bg: 'group-hover:bg-indigo-500/10', dot: 'bg-indigo-500/20 group-hover:bg-indigo-500', shadow: 'hover:shadow-[0_0_20px_rgba(99,102,241,0.4)]', textStatic: 'text-indigo-600 dark:text-indigo-400', hex: '#6366f1' },
            { border: 'border-lime-500/40 hover:border-lime-500', text: 'group-hover:text-lime-500', bg: 'group-hover:bg-lime-500/10', dot: 'bg-lime-500/20 group-hover:bg-lime-500', shadow: 'hover:shadow-[0_0_20px_rgba(132,204,22,0.4)]', textStatic: 'text-lime-600 dark:text-lime-400', hex: '#84cc16' }
        ];

        // --- Gemini AI Entry Sequence ---
        const GeminiEntry = ({ onComplete }) => {
            const [stage, setStage] = useState(0);
            useEffect(() => {
                const t1 = setTimeout(() => setStage(1), 1800); 
                const t2 = setTimeout(() => setStage(2), 2600); 
                const t3 = setTimeout(() => onComplete(), 3200); 
                return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
            }, [onComplete]);

            return (
                <div className={`fixed inset-0 z-[100] flex flex-col items-center justify-center bg-lightBg dark:bg-void transition-opacity duration-700 ${stage === 2 ? 'opacity-0' : 'opacity-100'}`}>
                    <div className="relative flex items-center justify-center">
                        <div className={`absolute w-32 h-32 rounded-full bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-amber-500 blur-[40px] transition-all duration-700 ease-in-out ${stage >= 1 ? 'scale-[30] opacity-0' : 'animate-spin-slow opacity-100'}`}></div>
                        <svg className={`relative z-10 w-20 h-20 transition-all duration-700 ${stage >= 1 ? 'scale-0 opacity-0 rotate-180' : 'animate-gemini-star'}`} viewBox="0 0 24 24" fill="none">
                            <path d="M12 0C12 6.62742 17.3726 12 24 12C17.3726 12 12 17.3726 12 24C12 17.3726 6.62742 12 0 12C6.62742 12 12 6.62742 12 0Z" fill="url(#gemini-grad)"/>
                            <defs>
                                <linearGradient id="gemini-grad" x1="0" y1="0" x2="24" y2="24">
                                    <stop stopColor="#06b6d4" />
                                    <stop offset="0.5" stopColor="#d946ef" />
                                    <stop offset="1" stopColor="#f59e0b" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div className={`mt-10 font-display font-bold tracking-widest text-xl gemini-text transition-all duration-500 ${stage >= 1 ? 'opacity-0 translate-y-8' : 'opacity-100 translate-y-0'}`}>
                        INITIALIZING COMMAND CENTER
                    </div>
                </div>
            );
        };

        // --- Ambient Background Blobs ---
        const AmbientBlobs = () => (
            <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
                <div className="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-cyan-500/10 dark:bg-cyan-500/15 blur-[120px] animate-blob transition-colors duration-700"></div>
                <div className="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-fuchsia-500/10 dark:bg-fuchsia-500/15 blur-[120px] animate-blob transition-colors duration-700" style={{animationDelay: '2s'}}></div>
            </div>
        );

        // --- Global Sync Context ---
        const SyncContext = React.createContext();

        // --- Navigation ---
        const Navbar = ({ theme, toggleTheme }) => {
            const [activeSection, setActiveSection] = useState('home');
            const { isSyncing, triggerSync } = React.useContext(SyncContext);

            useEffect(() => {
                const handleScroll = () => {
                    const sections = ['home', 'social', 'profile', 'learning', 'projects'];
                    const scrollPos = window.scrollY + 200;
                    for (const id of sections.reverse()) {
                        const el = document.getElementById(id);
                        if (el && el.offsetTop <= scrollPos) {
                            setActiveSection(id);
                            break;
                        }
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-40 w-[95%] max-w-6xl">
                    <div className="glass-base bg-lightCard dark:bg-darkCard border border-white/40 dark:border-white/10 rounded-full px-4 lg:px-6 py-4 flex items-center justify-between shadow-lg dark:shadow-2xl transition-all">
                        <div className="flex items-center gap-3 group cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                            <div className="w-3 h-3 rounded-full bg-cyan-500 animate-pulse group-hover:scale-125 transition-transform"></div>
                            <span className="font-display font-black tracking-widest text-sm text-slate-900 dark:text-white hidden lg:block group-hover:text-cyan-500 transition-colors">
                                RAGUL KUMAR E
                            </span>
                        </div>
                        
                        <div className="flex items-center gap-1 md:gap-3 font-mono text-[9px] md:text-xs font-bold tracking-widest">
                            {['home', 'social', 'profile', 'learning', 'projects'].map((sec, i) => {
                                const activeColor = glowStyles[i % glowStyles.length];
                                return (
                                    <a key={sec} href={`#${sec}`} className={`uppercase px-3 py-2 rounded-full transition-all duration-300 active:scale-95 ${activeSection === sec ? `bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-[0_0_15px_${activeColor.hex}80]` : `text-slate-500 dark:text-gray-400 hover:${activeColor.textStatic} hover:bg-slate-200 dark:hover:bg-white/10`}`}>
                                        {sec}
                                    </a>
                                )
                            })}
                        </div>
                        
                        <div className="flex items-center gap-2 lg:gap-4">
                            <button onClick={triggerSync} className="hidden md:flex items-center gap-2 font-mono text-[10px] tracking-widest bg-white/60 dark:bg-white/10 border border-slate-300 dark:border-white/10 px-4 py-2 rounded-full hover:border-cyan-500 hover:shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:text-cyan-600 dark:hover:text-cyan-400 transition-all text-slate-700 dark:text-white active:scale-95 group">
                                <Icon name="refresh-cw" size={14} className={isSyncing ? "animate-spin-fast text-cyan-500" : "group-hover:text-cyan-500 transition-colors"} />
                                {isSyncing ? "SYNCING..." : "SYNC"}
                            </button>
                            <button onClick={toggleTheme} className="p-2 rounded-full bg-white/80 dark:bg-white/10 text-slate-600 dark:text-gray-300 hover:shadow-md transition-all active:scale-90 border border-slate-200 dark:border-transparent hover:text-amber-500 dark:hover:text-amber-400">
                                <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={18} />
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        // --- AI Chatbot Component ---
        const Chatbot = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([
                { sender: 'bot', text: "Hello! I'm RK's AI Assistant. Ask me about his skills, projects, or how to contact him." }
            ]);
            const [input, setInput] = useState('');
            const endRef = useRef(null);

            useEffect(() => {
                if(isOpen && endRef.current) endRef.current.scrollIntoView({ behavior: "smooth" });
            }, [messages, isOpen]);

            const handleSend = (e) => {
                e.preventDefault();
                if(!input.trim()) return;
                
                const userText = input;
                setMessages(prev => [...prev, { sender: 'user', text: userText }]);
                setInput('');

                setTimeout(() => {
                    let reply = "I'm a simple assistant. To get in touch directly, please use the LinkedIn link in the footer!";
                    const lower = userText.toLowerCase();
                    
                    if(lower.includes('skill') || lower.includes('know')) reply = "Ragul specializes in Artificial Intelligence, Python, C++, and Cloud Security.";
                    else if(lower.includes('project') || lower.includes('repo')) reply = "He has several public repositories syncing live right now! Check out the 'Projects' section.";
                    else if(lower.includes('contact') || lower.includes('hire')) reply = "You can reach him professionally via his LinkedIn profile linked below.";
                    else if(lower.includes('course') || lower.includes('cert')) reply = "He holds a Google AI Professional Cert, Google AI Essentials, and an IBM SkillsBuild credential.";
                    
                    setMessages(prev => [...prev, { sender: 'bot', text: reply }]);
                }, 800);
            };

            return (
                <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end">
                    <div className={`mb-4 w-80 glass-base bg-lightCard dark:bg-[#120B16]/90 border border-white/50 dark:border-white/10 rounded-2xl shadow-2xl overflow-hidden transition-all duration-500 origin-bottom-right ${isOpen ? 'scale-100 opacity-100' : 'scale-0 opacity-0 pointer-events-none'}`}>
                        <div className="bg-gradient-to-r from-cyan-500 to-fuchsia-500 p-4 flex items-center justify-between text-white shadow-md">
                            <div className="flex items-center gap-2">
                                <Icon name="bot" size={20} />
                                <span className="font-display font-bold text-sm tracking-wide">RK Assistant</span>
                            </div>
                            <button onClick={() => setIsOpen(false)} className="hover:rotate-90 transition-transform active:scale-90"><Icon name="x" size={18} /></button>
                        </div>
                        
                        <div className="h-64 overflow-y-auto p-4 flex flex-col gap-3">
                            {messages.map((m, i) => (
                                <div key={i} className={`max-w-[85%] p-3 rounded-2xl text-sm font-sans shadow-sm transition-all animate-fade-in ${m.sender === 'bot' ? 'bg-white dark:bg-white/10 text-slate-800 dark:text-gray-200 self-start rounded-tl-none border border-slate-200 dark:border-transparent' : 'bg-cyan-500 text-white self-end rounded-tr-none'}`}>
                                    {m.text}
                                </div>
                            ))}
                            <div ref={endRef} />
                        </div>
                        
                        <form onSubmit={handleSend} className="p-3 border-t border-slate-200 dark:border-white/10 flex items-center gap-2 bg-white/50 dark:bg-transparent">
                            <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder="Type a message..." className="flex-1 bg-transparent text-sm focus:outline-none text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-gray-500" />
                            <button type="submit" className="p-2 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:scale-110 hover:shadow-[0_0_15px_rgba(6,182,212,0.5)] transition-all active:scale-95"><Icon name="send" size={14}/></button>
                        </form>
                    </div>

                    <button onClick={() => setIsOpen(!isOpen)} className="w-14 h-14 rounded-full bg-gradient-to-tr from-cyan-500 to-fuchsia-500 text-white flex items-center justify-center shadow-[0_0_20px_rgba(217,70,239,0.4)] hover:scale-110 active:scale-90 transition-all duration-300">
                        <Icon name={isOpen ? "x" : "message-square"} size={24} className={isOpen ? "rotate-90 transition-transform" : "transition-transform"} />
                    </button>
                </div>
            );
        };

        // --- Sections ---

        const Home = () => {
            const { gitData } = React.useContext(SyncContext);
            
            // Full links array added directly to the hero section
            const accountLinks = [
                { name: "LinkedIn", url: "https://www.linkedin.com/in/ragul-kumar-e-5ba272399", icon: "linkedin", c: glowStyles[0] },
                { name: "GitHub", url: "https://github.com/Galleon-123", icon: "github", c: glowStyles[1] },
                { name: "Coursera", url: "https://www.coursera.org/user/92a729aaba78f5ec50fa6c3c2610d7a1", icon: "book", c: glowStyles[2] },
                { name: "Credly", url: "https://www.credly.com/users/ragul-kumar-e", icon: "award", c: glowStyles[3] },
                { name: "HackerRank", url: "https://www.hackerrank.com/profile/ragulkumare2007", icon: "code", c: glowStyles[4] }
            ];

            return (
                <section id="home" className="relative min-h-screen pt-32 pb-12 z-10 max-w-[1400px] mx-auto px-6 lg:px-16 flex flex-col justify-center">
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center mb-16">
                        <div className="lg:col-span-7 flex flex-col gap-6">
                            <Reveal delay={100}>
                                <div className="flex flex-wrap items-center gap-3 font-mono text-[10px] tracking-widest">
                                    <span className="glass-base bg-lightCard dark:bg-white/5 border border-white/50 dark:border-cyan-500/30 px-4 py-1.5 rounded-full text-slate-800 dark:text-white font-bold uppercase shadow-sm">
                                        IT Portfolio - Data Science - Cloud Security
                                    </span>
                                </div>
                            </Reveal>
                            
                            <Reveal delay={200}>
                                <h1 className="text-5xl lg:text-7xl font-display font-black leading-[1.05] tracking-tight text-slate-900 dark:text-white">
                                    RAGUL KUMAR E
                                </h1>
                                <h2 className="text-3xl lg:text-4xl font-display font-bold mt-2 gemini-text">Tech Enthusiast.</h2>
                            </Reveal>
                            
                            <Reveal delay={300}>
                                <p className="text-slate-600 dark:text-gray-400 font-sans text-base leading-relaxed max-w-xl">
                                    A professional digital command center for AI learning, data science, software architecture, and cloud security, presenting a verified public record and real-time analytics.
                                </p>
                            </Reveal>

                            <Reveal delay={400}>
                                <div className="flex flex-wrap gap-3 mt-4">
                                    {["Python", "C++", "Cloud Security", "AI", "Data Science"].map((skill, i) => {
                                        const c = glowStyles[i%glowStyles.length];
                                        return (
                                            <span key={i} className={`font-mono text-[11px] font-bold border bg-white dark:bg-white/5 px-4 py-2 rounded-full cursor-default transition-all duration-300 shadow-sm hover:scale-105 hover:-translate-y-1 ${c.border} ${c.textStatic} ${c.text} ${c.shadow}`}>
                                                {skill}
                                            </span>
                                        );
                                    })}
                                </div>
                            </Reveal>
                            
                            {/* RESTORED: Account Links directly in Hero */}
                            <Reveal delay={500}>
                                <div className="flex flex-wrap gap-4 mt-4">
                                    {accountLinks.map((link, i) => (
                                        <a key={i} href={link.url} target="_blank" className={`flex items-center gap-2 glass-base bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 px-5 py-2.5 rounded-full transition-all text-[10px] font-mono font-bold tracking-widest text-slate-600 dark:text-gray-300 shadow-sm hover:scale-105 active:scale-95 group hover:-translate-y-1 ${link.c.border} ${link.c.text} ${link.c.shadow} ${link.c.bg}`}>
                                            <Icon name={link.icon} size={14} className="group-hover:scale-110 transition-transform" /> {link.name}
                                        </a>
                                    ))}
                                </div>
                            </Reveal>
                        </div>

                        {/* Identity Card with Spinning Gradient Animation */}
                        <div className="lg:col-span-5 relative flex justify-center">

                        </Reveal>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {repoList.length > 0 ? repoList.map((repo, i) => {
                                const c = glowStyles[i % glowStyles.length];
                                return (
                                    <Reveal key={i} delay={i * 100}>
                                        <a href={repo.html_url} target="_blank" className={`block glass-base bg-lightCard dark:bg-darkCard p-6 rounded-2xl group border transition-all duration-300 shadow-md hover:-translate-y-2 ${c.border} ${c.shadow} ${c.bg}`}>
                                            <div className="flex justify-between items-start mb-3">
                                                <h3 className={`text-lg font-display font-bold transition-colors flex items-center gap-2 ${c.textStatic} ${c.text}`}>
                                                    <Icon name="folder-git-2" size={18} className="text-slate-500 group-hover:text-current group-hover:rotate-6 transition-transform" /> {repo.name}
                                                </h3>
                                                {repo.language && <span className="font-mono text-[10px] font-bold px-2 py-1 bg-white dark:bg-white/10 rounded text-slate-600 dark:text-gray-300 shadow-sm">{repo.language}</span>}
                                            </div>
                                            <p className="text-sm text-slate-600 dark:text-gray-400 mb-4">{repo.description || "No public description provided."}</p>
                                            <div className="flex items-center gap-4 font-mono text-[10px] font-bold text-slate-500 uppercase">
                                                <span className={`flex items-center gap-1 transition-colors ${c.textStatic} ${c.text}`}><Icon name="star" size={12} /> {repo.stargazers_count} Stars</span>
                                            </div>
                                        </a>
                                    </Reveal>
                                )
                            }) : (
                                <div className="glass-base bg-lightCard dark:bg-white/5 p-6 rounded-2xl text-slate-500 font-mono text-xs text-center col-span-2 shadow-md">
                                    {isSyncing ? "Syncing data..." : "No repositories found."}
                                </div>
                            )}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="border-t border-slate-300 dark:border-white/10 bg-white dark:bg-void py-16 relative z-10">
                <div className="max-w-[1400px] mx-auto px-6 lg:px-16 flex flex-col items-center text-center gap-8">
                    <Reveal>
                        <h2 className="text-4xl md:text-5xl font-display font-black text-slate-900 dark:text-white tracking-tighter">Connected Profiles</h2>
                        <p className="text-slate-500 text-sm mt-4 max-w-md mx-auto">Public source check: May 21, 2026. Private analytics and account-only dashboard data are not included.</p>
                    </Reveal>
                    
                    <Reveal delay={100}>
                        <div className="flex flex-wrap justify-center gap-4">
                            {[
                                { name: "LinkedIn", url: "https://www.linkedin.com/in/ragul-kumar-e-5ba272399", icon: "linkedin", c: glowStyles[0] },
                                { name: "GitHub", url: "https://github.com/Galleon-123", icon: "github", c: glowStyles[1] },
                                { name: "Coursera", url: "https://www.coursera.org/user/92a729aaba78f5ec50fa6c3c2610d7a1", icon: "book", c: glowStyles[2] },
                                { name: "Credly", url: "https://www.credly.com/users/ragul-kumar-e", icon: "award", c: glowStyles[3] },
                                { name: "HackerRank", url: "https://www.hackerrank.com/profile/ragulkumare2007", icon: "code", c: glowStyles[4] }
                            ].map((link, i) => (
                                <a key={i} href={link.url} target="_blank" className={`flex items-center gap-2 glass-base bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 px-6 py-3 rounded-full transition-all text-xs font-mono font-bold tracking-widest text-slate-600 dark:text-gray-300 shadow-sm hover:scale-105 active:scale-95 group ${link.c.border} ${link.c.text} ${link.c.shadow} ${link.c.bg}`}>
                                    <Icon name={link.icon} size={14} className="group-hover:scale-110 group-hover:-rotate-6 transition-transform" /> {link.name}
                                </a>
                            ))}
                        </div>
                    </Reveal>
                </div>
            </footer>
        );

        const App = () => {
            const [entered, setEntered] = useState(false);
            const [theme, setTheme] = useState('dark');
            const [isSyncing, setIsSyncing] = useState(false);
            const [lastSynced, setLastSynced] = useState(new Date().toLocaleTimeString());
            const [toast, setToast] = useState(null);
            
            // GitHub Data State
            const [gitData, setGitData] = useState({ repos: 1, followers: 0, following: 1, stars: 1 });
            const [repoList, setRepoList] = useState([]);

            const fetchGitData = async () => {
                try {
                    const [userRes, reposRes] = await Promise.all([
                        fetch('https://api.github.com/users/Galleon-123'),
                        fetch('https://api.github.com/users/Galleon-123/repos?sort=updated&per_page=4')
                    ]);
                    const user = await userRes.json();
                    const repos = await reposRes.json();
                    const stars = repos.reduce((acc, r) => acc + r.stargazers_count, 0);
                    setGitData({ repos: user.public_repos||1, followers: user.followers||0, following: user.following||1, stars: stars||1 });
                    if(Array.isArray(repos)) setRepoList(repos);
                } catch(e) {}
            };

            // Initial fetch
            useEffect(() => { fetchGitData(); }, []);

            const triggerSync = () => {
                if(isSyncing) return;
                setIsSyncing(true);
                Promise.all([
                    new Promise(res => setTimeout(res, 2000)),
                    fetchGitData()
                ]).then(() => {
                    setIsSyncing(false);
                    setLastSynced(new Date().toLocaleTimeString());
                    setToast("Webhooks synced successfully. All records updated.");
                    setTimeout(() => setToast(null), 4000);
                });
            };

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

            return (
                <SyncContext.Provider value={{ isSyncing, triggerSync, lastSynced, gitData, repoList }}>
                    <main className="relative">
                        {!entered && <GeminiEntry onComplete={() => setEntered(true)} />}
                        
                        {entered && (
                            <div className="animate-fade-in">
                                <AmbientBlobs />
                                <Navbar theme={theme} toggleTheme={toggleTheme} />
                                <Home />
                                <SocialAnalytics />
                                <Profile />
                                <Learning />
                                <Projects />
                                <Footer />
                                <Chatbot />

                                {/* Toast Notification */}
                                <div className={`fixed bottom-6 left-6 z-50 glass-base bg-emerald-500/90 text-white px-6 py-3 rounded-full flex items-center gap-3 transition-all duration-500 shadow-xl ${toast ? 'translate-x-0 opacity-100' : '-translate-x-20 opacity-0 pointer-events-none'}`}>
                                    <Icon name="check-circle" size={18} />
                                    <span className="font-mono text-xs font-bold tracking-wider">{toast}</span>
                                </div>
                            </div>
                        )}
                    </main>
                </SyncContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
